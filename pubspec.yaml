name: delivery_manager
description: "Delivery Manager App - Management application for the delivery system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Clean Architecture dependencies
  equatable: ^2.0.5
  dio: ^5.4.0
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  get_it: ^9.0.5

  # UI dependencies
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_messaging: ^16.0.4
  firebase_crashlytics: ^5.0.4
  google_sign_in: ^6.2.1
  
  # Permission handling
  permission_handler: ^12.0.1
  
  # Localization dependencies
  intl:
  flutter_localizations:
    sdk: flutter
  
  # clock.now() instead of DateTime.now(), so tests can move time (withClock / fake_async)
  clock: ^1.1.2
  
  # UI dependencies
  lottie: ^3.3.2
  smart_auth: ^3.2.0
  pinput: ^5.0.2
  url_launcher: ^6.2.2

  # Package info for app version
  package_info_plus: ^9.0.0

  # Device identification for anti-spam registration/login guard
  device_info_plus: ^10.1.0
  
  # Logging
  logger: ^2.0.2+1
  
  # Responsive sizing
  sizer: ^3.1.3
  
  # Dropdown button
  dropdown_button2: ^2.3.9
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  
  # Testing dependencies (see test/README.md)
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  # The launcher icon is told from Flutter's own by its SHA-1 (test/app/assets_test.dart)
  crypto: ^3.0.7
  bloc_test: ^10.0.0
  # Plugin fakes are installed at the plugins' platform interfaces
  plugin_platform_interface: ^2.1.8
  permission_handler_platform_interface: ^4.3.0
  url_launcher_platform_interface: ^2.3.2
  flutter_secure_storage_platform_interface: ^1.1.2

flutter:
  generate: true

  uses-material-design: true

  assets:
    - .env
    - assets/images/

# Native splash screen configuration
# Android 12+ plays res/drawable/lihlih_splash_orange.xml instead (test/app/native_splash_test.dart): after :create, put it back in values-v31 and values-night-v31
flutter_native_splash:
  # Android and iOS only: dart run flutter_native_splash:create
  web: false
  color: "#FEF8F1"
  image: assets/brand/splash.png
  color_dark: "#000000"
  image_dark: assets/brand/splash.png

  android_12:
    image: assets/brand/splash.png
    color: "#FEF8F1"
    image_dark: assets/brand/splash.png
    color_dark: "#000000"

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  # Replace assets/brand/icon*.png, then: dart run flutter_launcher_icons
  image_path: "assets/brand/icon.png"
  image_path_ios_dark_transparent: "assets/brand/icon_dark.png"
  image_path_ios_tinted_grayscale: "assets/brand/icon_tinted.png"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  adaptive_icon_monochrome: "assets/brand/icon_monochrome.png"
  adaptive_icon_background: "#FEF8F1"
  adaptive_icon_foreground_inset: 0 # the kit keeps the word inside the safe zone already
  remove_alpha_ios: true
